<style>
:root {
  color-scheme: light;
  --page: #f6f5f0;
  --surface: #fdfdfa;
  --ink: #191821;
  --ink-2: #5b5952;
  --muted: #8b897f;
  --hairline: #e3e1d6;
  --accent: #3d4a9e;
  --accent-soft: #dfe3f4;
  --bar: #4a58b5;
  --bar-dim: #c9cfec;
  --good: #0ca30c;
  --warn: #b97a00;
  --crit: #c23a3a;
  --shadow: 0 1px 2px rgba(25,24,33,.05), 0 4px 16px rgba(25,24,33,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0e0e11;
    --surface: #191921;
    --ink: #f0efe8;
    --ink-2: #b3b1a6;
    --muted: #86847c;
    --hairline: #2c2c33;
    --accent: #96a0ec;
    --accent-soft: #262b45;
    --bar: #7a87e0;
    --bar-dim: #33395c;
    --good: #3dbb3d;
    --warn: #d99b2b;
    --crit: #e06666;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e0e11;
  --surface: #191921;
  --ink: #f0efe8;
  --ink-2: #b3b1a6;
  --muted: #86847c;
  --hairline: #2c2c33;
  --accent: #96a0ec;
  --accent-soft: #262b45;
  --bar: #7a87e0;
  --bar-dim: #33395c;
  --good: #3dbb3d;
  --warn: #d99b2b;
  --crit: #e06666;
  --shadow: none;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  font-size: 14.5px;
  line-height: 1.65;
}
.wrap { max-width: 1060px; margin: 0 auto; padding: 28px 20px 64px; }

/* masthead */
.masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 2px 18px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }
.masthead h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-weight: 600; font-size: 26px; letter-spacing: .06em; margin: 0; }
.masthead .date { color: var(--ink-2); font-size: 13px; letter-spacing: .08em; }
.masthead .date b { color: var(--ink); font-weight: 600; }

/* KPI row */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 26px; }
.kpi { background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; padding: 12px 14px 10px; box-shadow: var(--shadow); }
.kpi .label { font-size: 11.5px; color: var(--ink-2); letter-spacing: .08em; }
.kpi .value { font-size: 30px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }
.kpi .sub { font-size: 11.5px; color: var(--muted); }
.kpi .sub .alert { color: var(--crit); font-weight: 600; }

/* sections */
section { margin-bottom: 30px; }
.eyebrow { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.eyebrow h2 { font-size: 15px; font-weight: 700; letter-spacing: .12em; margin: 0; }
.eyebrow .rule { flex: 1; border-top: 1px solid var(--hairline); transform: translateY(-4px); }
.eyebrow a { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.eyebrow a:hover, .eyebrow a:focus-visible { text-decoration: underline; }
.card { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }

/* briefing */
.brief { border-left: 3px solid var(--accent); }
.brief ul { margin: 0; padding-left: 1.2em; }
.brief li { margin: 7px 0; }
.brief li::marker { color: var(--accent); }
.brief b { font-weight: 700; }

/* tasks */
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .06em; padding: 4px 8px; border-bottom: 1px solid var(--hairline); }
td { padding: 8px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
a.plain { color: inherit; text-decoration: none; }
a.plain:hover, a.plain:focus-visible { color: var(--accent); text-decoration: underline; }
.note { color: var(--muted); font-size: 12px; }

/* pills */
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--hairline); color: var(--ink-2); white-space: nowrap; }
.pill.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.pill.good { color: var(--good); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.crit { color: var(--crit); border-color: currentColor; }

/* bar rows (magnitude, single hue) */
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 9.5em 1fr 2.5em; align-items: center; gap: 10px; font-size: 13px; }
.bar-row .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 14px; border-radius: 0 4px 4px 0; background: var(--bar); min-width: 3px; }
.bar-row.dim .track { background: var(--bar-dim); }
.bar-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.chart-note { font-size: 11.5px; color: var(--muted); margin-top: 10px; }

/* meter */
.meter { display: flex; height: 18px; border-radius: 5px; overflow: hidden; gap: 2px; background: transparent; margin: 8px 0 6px; }
.meter div { min-width: 4px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* lists */
.rlist { list-style: none; margin: 0; padding: 0; }
.rlist li { padding: 8px 2px; border-bottom: 1px solid var(--hairline); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.rlist li:last-child { border-bottom: none; }
.rlist .t { flex: 1 1 auto; min-width: 200px; }
.rlist a { color: inherit; text-decoration: none; }
.rlist a:hover, .rlist a:focus-visible { color: var(--accent); text-decoration: underline; }
.stale { color: var(--warn); font-size: 11.5px; font-weight: 600; }
.fresh { color: var(--good); font-size: 11.5px; font-weight: 600; }

footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--hairline); font-size: 12px; color: var(--muted); }
footer a { color: var(--accent); text-decoration: none; margin-right: 14px; }
footer a:hover, footer a:focus-visible { text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) {
  .bar-row .track { transition: width .5s ease; }
}
</style>

":null,"finished":null},{"title":"寄付白書","genres":["WE"],"priority":"マスト","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"最強M＆A","genres":["コンサル"],"priority":null,"medium":null,"status":"未着手","bought":false,"rating":null,"finished":null},{"title":"大学四年間の～政治学","genres":["教養"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"起業の科学ver2","genres":["起業"],"priority":"高","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～統計学","genres":["教養"],"priority":"中","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～金融学","genres":["教養"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"（無題）","genres":[],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～マーケティング","genres":["教養"],"priority":"低","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～社会学","genres":["教養"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"日本の寄付を科学する","genres":["WE"],"priority":"マスト","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"意思決定のための分析の技術","genres":["コンサル"],"priority":"マスト","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"コア事業進化論","genres":["コンサル"],"priority":null,"medium":null,"status":"未着手","bought":false,"rating":null,"finished":null},{"title":"大学四年間の～データサイエンス","genres":["教養"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～経済","genres":["教養"],"priority":"低","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"マッキンゼー価値を作る","genres":["コンサル"],"priority":null,"medium":null,"status":"未着手","bought":false,"rating":null,"finished":null},{"title":"大学四年間の～経営学","genres":["教養"],"priority":"低","medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～哲学","genres":["教養"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"エクセル最強の教科書","genres":["ハードスキル"],"priority":null,"medium":null,"status":"未着手","bought":false,"rating":null,"finished":null},{"title":"認知バイアス辞典","genres":["思想"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"認知バイアス辞典2","genres":["思想"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null},{"title":"大学四年間の～宗教学","genres":["教養"],"priority":null,"medium":null,"status":"未着手","bought":true,"rating":null,"finished":null}],"notionLinks":{"タスク管理":"https://app.notion.com/p/bcd10a912f2a44eda321463c49059b09","Inbox":"https://app.notion.com/p/15cd2565d758489a8bd7bd7c873e6d61","読書リスト":"https://app.notion.com/p/2bcaf155527180f48676f5b0059a0e24","文章":"https://app.notion.com/p/248af155527181bab092f207c162b68e","運用ルール":"https://app.notion.com/p/39caf155527181ac983ee87d1673bf4e"}}</script>
<div class="wrap" id="app"></div>
<script>
const S = JSON.parse(document.getElementById('snapshot').textContent);
const TODAY = S.generatedAt;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtDate = d => { if (!d) return '—'; const [y,m,dd] = d.slice(0,10).split('-'); return `${m}/${dd}`; };

// ---- aggregates ----
const inbox = S.inbox, books = S.books, tasks = S.tasks, writings = S.writings;
const unsorted = inbox.filter(i => i.status === '未整理');
const toRead = inbox.filter(i => i.link && !i.read);
const tagCount = {};
inbox.forEach(i => (i.tags || []).forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
const SUBTHEMES = ['自己分析','自分史','AI活用','能力・才能観','キャリア・人生設計','発信・ブランディング','習慣・時間設計','人間関係・恋愛'];
const MAINTAGS = ['思想','記録','アイデア','仕事','学び'];
const srcCount = {};
inbox.forEach(i => srcCount[i.source || '不明'] = (srcCount[i.source || '不明'] || 0) + 1);

const done = books.filter(b => b.status === '読了');
const reading = books.filter(b => b.status === '読書中');
const tsundoku = books.filter(b => b.status === '未着手' && b.bought);
const wishlist = books.filter(b => b.status === '未着手' && !b.bought);
// 次に読む候補: 週次読書おすすめのロジック（マスト→高、WE/ベイン指定は仕事直結で優先）
const prioRank = { 'マスト': 0, '高': 1, '中': 2, '低': 3 };
const bookScore = b => (prioRank[b.priority] ?? 4) - ((b.genres.includes('WE') || b.genres.includes('ベイン指定')) ? 0.5 : 0);
const queue = tsundoku.filter(b => ['マスト','高'].includes(b.priority)).sort((a,b) => bookScore(a) - bookScore(b));

const wStatus = { 'テーマのみ': [], '進行中': [], '完了': [] };
writings.forEach(w => (wStatus[w.status] || []).push(w));

// ---- render helpers ----
const barRows = (pairs, max, dim) => pairs.map(([label, n]) =>
  `<div class="bar-row${dim ? ' dim' : ''}">
     <span class="lbl" title="${esc(label)}">${esc(label)}</span>
     <div><div class="track" style="width:${Math.max(2, n / max * 100)}%"></div></div>
     <span class="val">${n}</span>
   </div>`).join('');

const prioPill = p => p === 'マスト' ? '<span class="pill crit">マスト</span>'
  : p === '高' ? '<span class="pill warn">高</span>'
  : p ? `<span class="pill">${esc(p)}</span>` : '';

// ---- sections ----
const kpis = `
<div class="kpis">
  <div class="kpi"><div class="label">未完了タスク</div><div class="value">${tasks.filter(t => t.status !== '完了').length}<small>件</small></div><div class="sub">すべてWE・8月上旬期限</div></div>
  <div class="kpi"><div class="label">思考ログ（Inbox）</div><div class="value">${inbox.length}<small>件</small></div><div class="sub">${unsorted.length ? `<span class="alert">未整理 ${unsorted.length}件</span>` : '整理済み'}</div></div>
  <div class="kpi"><div class="label">あとで読む（未読）</div><div class="value">${toRead.length}<small>本</small></div><div class="sub">リンク付き・読了チェックなし</div></div>
  <div class="kpi"><div class="label">積読（購入済み）</div><div class="value">${tsundoku.length}<small>冊</small></div><div class="sub">うちマスト/高 ${queue.length}冊</div></div>
  <div class="kpi"><div class="label">書きかけの文章</div><div class="value">${wStatus['進行中'].length}<small>本</small></div><div class="sub">テーマ待ち ${wStatus['テーマのみ'].length}本</div></div>
</div>`;

const dueStr = t => {
  const d = days(TODAY, t.due);
  return `${fmtDate(t.due)}（あと${d}日）`;
};
const briefing = `
<section>
  <div class="eyebrow"><h2>秘書メモ ─ 今日の視点</h2><div class="rule"></div></div>
  <div class="card brief"><ul>
    <li><b>タスクは薄い週。</b>未完了は WE の TSS 8/9 イベント関連 3 件のみ（期限 8/9〜8/10）。今週動くなら「<b>Peatix グループのフォロー申請（共同管理者化）</b>」だけ先に済ませると、申込チェックと集客が待ちゼロで回り出します。</li>
    <li><b>書きどきのテーマがあります。</b>今日文章DBに立てた「<b>マージナルマン</b>」がテーマのみの状態。Inboxには自分史 ${tagCount['自分史'] || 0} 件・自己分析 ${tagCount['自己分析'] || 0} 件の素材が既に貯まっているので、下敷きには困りません。進行中 4 本のうち「妥協・諦め」「妥協と選択」は 2 月から止まっており、どちらかを完走させるのも手です。</li>
    <li><b>読書は「仕事直結マスト」から。</b>『寄付白書』『日本の寄付を科学する』（WE・マスト）と『意思決定のための分析の技術』（マスト）が今日リスト入り。積読 ${tsundoku.length} 冊ありますが、まずこの 3 冊＋ベイン指定 6 冊が投資対効果の高い山です。</li>
    <li><b>Inboxの掃除は軽微。</b>未整理 ${unsorted.length} 件だけ。あとで読む ${toRead.length} 本のうち Claude Code / AI 活用系が 3 本あり、いまのAI秘書構築に直結するので先に消化推奨。</li>
  </ul></div>
</section>`;

const taskRows = tasks.map(t => `
  <tr>
    <td><a class="plain" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.task)}</a><div class="note">${esc(t.note)}</div></td>
    <td><span class="pill acc">${esc(t.project)}</span></td>
    <td class="num">${dueStr(t)}</td>
    <td><span class="pill">${esc(t.status)}</span></td>
  </tr>`).join('');
const taskSec = `
<section>
  <div class="eyebrow"><h2>タスク</h2><div class="rule"></div><a href="${esc(S.notionLinks['タスク管理'])}" target="_blank" rel="noopener">Notionで開く →</a></div>
  <div class="card" style="overflow-x:auto">
    <table>
      <thead><tr><th>タスク</th><th>PJ</th><th>期限</th><th>状態</th></tr></thead>
      <tbody>${taskRows}</tbody>
    </table>
  </div>
</section>`;

const staleness = w => {
  const d = days(w.updated, TODAY);
  if (d <= 7) return '<span class="fresh">今週更新</span>';
  if (d >= 90) return `<span class="stale">${Math.floor(d/30)}ヶ月停滞</span>`;
  if (d >= 30) return `<span class="stale">${Math.floor(d/30)}ヶ月前</span>`;
  return `<span class="note">${d}日前</span>`;
};
const wPill = s => s === '完了' ? '<span class="pill good">完了</span>' : s === '進行中' ? '<span class="pill acc">進行中</span>' : '<span class="pill">テーマのみ</span>';
const writeRows = writings.map(w => `
  <li>
    <span class="t"><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.title)}</a></span>
    ${wPill(w.status)}
    <span class="note num">${w.chars ? w.chars.toLocaleString() + '字' : '本文なし'}</span>
    ${staleness(w)}
  </li>`).join('');
const writeSec = `
<section>
  <div class="eyebrow"><h2>執筆パイプライン</h2><div class="rule"></div><a href="${esc(S.notionLinks['文章'])}" target="_blank" rel="noopener">文章DBを開く →</a></div>
  <div class="card"><ul class="rlist">${writeRows}</ul></div>
</section>`;

const subPairs = SUBTHEMES.map(t => [t, tagCount[t] || 0]).filter(p => p[1]).sort((a,b) => b[1] - a[1]);
const mainPairs = MAINTAGS.map(t => [t, tagCount[t] || 0]).filter(p => p[1]).sort((a,b) => b[1] - a[1]);
const srcPairs = Object.entries(srcCount).sort((a,b) => b[1] - a[1]);
const maxSub = Math.max(...subPairs.map(p => p[1]));
const maxMain = Math.max(...mainPairs.map(p => p[1]));
const maxSrc = Math.max(...srcPairs.map(p => p[1]));
const toReadRows = toRead.map(i => `
  <li>
    <span class="t"><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></span>
    <span class="pill">${esc(i.source || '—')}</span>
    <a class="note" href="${esc(i.url)}" target="_blank" rel="noopener">Inbox↗</a>
  </li>`).join('');
const inboxSec = `
<section>
  <div class="eyebrow"><h2>思考ログ ─ Inbox ${inbox.length}件の中身</h2><div class="rule"></div><a href="${esc(S.notionLinks['Inbox'])}" target="_blank" rel="noopener">Notionで開く →</a></div>
  <div class="grid2">
    <div class="card">
      <p class="note" style="margin:0 0 10px">「思想」${tagCount['思想'] || 0}件のサブテーマ内訳 ─ 何を考えてきたかの地図</p>
      <div class="bars">${barRows(subPairs, maxSub)}</div>
    </div>
    <div class="card">
      <p class="note" style="margin:0 0 10px">大分類タグ / 流入ソース</p>
      <div class="bars">${barRows(mainPairs, maxMain)}</div>
      <div style="height:14px"></div>
      <div class="bars">${barRows(srcPairs, maxSrc, true)}</div>
      <p class="chart-note">タグは1件に複数付くため合計は${inbox.length}件を超えます。</p>
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="card">
    <p class="note" style="margin:0 0 6px">あとで読む（未読リンク ${toRead.length}本）</p>
    <ul class="rlist">${toReadRows}</ul>
  </div>
</section>`;

const queueRows = queue.map(b => `
  <li>
    <span class="t">${esc(b.title)}</span>
    ${(b.genres.includes('WE') || b.genres.includes('ベイン指定')) ? '<span class="pill acc">仕事直結</span>' : ''}
    ${prioPill(b.priority)}
    <span class="note">${esc(b.genres.filter(g => !['WE','ベイン指定'].includes(g)).join('・') || b.genres.join('・'))}</span>
  </li>`).join('');
const doneRows = done.sort((a,b) => (b.finished || '').localeCompare(a.finished || '')).map(b => `
  <li>
    <span class="t">${esc(b.title)}</span>
    <span class="note">${b.rating ? '★'.repeat(b.rating) : '評価未'}</span>
    <span class="note num">${fmtDate(b.finished)}</span>
  </li>`).join('');
const total = books.length;
const readingSec = `
<section>
  <div class="eyebrow"><h2>読書</h2><div class="rule"></div><a href="${esc(S.notionLinks['読書リスト'])}" target="_blank" rel="noopener">読書リストを開く →</a></div>
  <div class="card">
    <div class="meter" role="img" aria-label="読了${done.length}冊、読書中${reading.length}冊、積読${tsundoku.length}冊、未購入${wishlist.length}冊">
      <div style="width:${done.length/total*100}%;background:var(--good)" title="読了 ${done.length}"></div>
      ${reading.length ? `<div style="width:${reading.length/total*100}%;background:var(--bar)" title="読書中 ${reading.length}"></div>` : ''}
      <div style="width:${tsundoku.length/total*100}%;background:var(--bar-dim)" title="積読 ${tsundoku.length}"></div>
      <div style="width:${wishlist.length/total*100}%;background:var(--hairline)" title="未購入 ${wishlist.length}"></div>
    </div>
    <div class="legend">
      <span><span class="sw" style="background:var(--good)"></span>読了 ${done.length}</span>
      ${reading.length ? `<span><span class="sw" style="background:var(--bar)"></span>読書中 ${reading.length}</span>` : ''}
      <span><span class="sw" style="background:var(--bar-dim)"></span>積読（購入済） ${tsundoku.length}</span>
      <span><span class="sw" style="background:var(--hairline)"></span>気になる（未購入） ${wishlist.length}</span>
    </div>
  </div>
  <div style="height:14px"></div>
  <div class="grid2">
    <div class="card">
      <p class="note" style="margin:0 0 6px">次に読む候補（マスト→高、仕事直結を優先） ${queue.length}冊</p>
      <ul class="rlist">${queueRows}</ul>
    </div>
    <div class="card">
      <p class="note" style="margin:0 0 6px">読了 ${done.length}冊</p>
      <ul class="rlist">${doneRows}</ul>
    </div>
  </div>
</section>`;

document.getElementById('app').innerHTML = `
  <header class="masthead">
    <h1>AI秘書コックピット</h1>
    <span class="date">スナップショット <b>${TODAY.replace(/-/g, '.')}</b> ・ ${esc(S.workspace)}</span>
  </header>
  ${kpis}
  ${briefing}
  <div class="grid2" style="align-items:start">
    <div>${taskSec}</div>
    <div>${writeSec}</div>
  </div>
  ${inboxSec}
  ${readingSec}
  <footer>
    <a href="${esc(S.notionLinks['タスク管理'])}" target="_blank" rel="noopener">タスク管理</a>
    <a href="${esc(S.notionLinks['Inbox'])}" target="_blank" rel="noopener">Inbox</a>
    <a href="${esc(S.notionLinks['読書リスト'])}" target="_blank" rel="noopener">読書リスト</a>
    <a href="${esc(S.notionLinks['文章'])}" target="_blank" rel="noopener">文章DB</a>
    <a href="${esc(S.notionLinks['運用ルール'])}" target="_blank" rel="noopener">運用ルール</a>
    <span>更新はCoworkに「コックピット更新して」と言うだけ（README参照）</span>
  </footer>`;
</script>
</body>
</html>
